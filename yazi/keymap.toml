#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	# Shell
	{ on = "<C-s>", run = 'shell "$SHELL" --block', desc = "Open shell here" },

	# Preview seeking (K/J are remapped to half-page movement below)
	{ on = "<C-u>", run = "seek -5", desc = "Seek up 5 units in the preview" },
	{ on = "<C-d>", run = "seek 5",  desc = "Seek down 5 units in the preview" },

	# Movement
	{ on = "K",     run = "arrow -50%", desc = "Move cursor up half page" },
	{ on = "J",     run = "arrow 50%",  desc = "Move cursor down half page" },
	{ on = "<A-k>", run = "arrow -5",   desc = "Move cursor up 5 files" },
	{ on = "<A-j>", run = "arrow 5",    desc = "Move cursor down 5 files" },

	# Find / filter / search
	{ on = [ "f", "g" ], run = "plugin fr rg",         desc = "Find file by content (rg; <C-s> toggles fzf match)" },
	{ on = [ "f", "n" ], run = "plugin fzf",           desc = "Find file by name (fzf)" },
	{ on = [ "f", "f" ], run = "filter --smart",       desc = "Filter files" },
	{ on = [ "f", "F" ], run = "plugin smart-filter",  desc = "Smart filter" },
	{ on = "s",          run = "plugin jump-to-char",  desc = "Jump to file starting with <char>" },
	{ on = "S",          run = "search --via=fd",      desc = "Search files by name via fd" },

	# Panes
	{ on = "T", run = "plugin toggle-pane min-preview", desc = "Hide or show the preview" },

	# Archive
	{ on = [ "c", "a" ], run = "plugin compress", desc = "Archive selected files" },

	# Yank + put file URIs on the Wayland clipboard (paste into GUI apps)
	{ on = "y", run = [
		'''shell 'for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list' ''',
		"yank",
	], desc = "Yank files and copy them to the clipboard" },

	# Goto (overrides the default `g d` -> ~/Downloads)
	{ on = [ "g", "d" ], run = "cd ~/Stažené/", desc = "Go to Stažené" },

	# Create
	{ on = "A", run = "create --dir", desc = "Create a directory" },
]

append_keymap = [
	{ on = "e", run = "open",               desc = "Open the selected files" },
	{ on = "E", run = "open --interactive", desc = "Open the selected files interactively" },

	# Goto
	{ on = [ "g", "n" ], run = "cd ~/.config/nvim/",              desc = "Go to the nvim config" },
	{ on = [ "g", "v" ], run = "cd ~/Videa/",                     desc = "Go to Videa" },
	{ on = [ "g", "p" ], run = "cd ~/Obrázky/",                   desc = "Go to Obrázky" },
	{ on = [ "g", "s" ], run = "cd ~/Obrázky/Screenshots/",       desc = "Go to screenshots" },
	{ on = [ "g", "D" ], run = "cd ~/Dokumenty/",                 desc = "Go to Dokumenty" },
	{ on = [ "g", "o" ], run = "cd ~/obsidian/",                  desc = "Go to obsidian" },
	{ on = [ "g", "e" ], run = "cd ~/Projekty/",                  desc = "Go to Projekty" },
]

[input]
prepend_keymap = [
	{ on = "<Esc>", run = "close", desc = "Cancel input" },
]

[cmp]
prepend_keymap = [
	{ on = "<C-k>", run = "arrow prev", desc = "Previous item" },
	{ on = "<C-j>", run = "arrow next", desc = "Next item" },
]
