#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = true

[opener]
# `%s` = paths of all selected files, `%s1` = path of the first selected file.
# See https://yazi-rs.github.io/docs/configuration/yazi#opener
folder = [
	{ run = 'hyprctl dispatch exec "[float; size 60% 60%; center 1] nemo %s"', orphan = true, desc = "nemo", for = "linux" },
	{ run = 'nvim %s1',                block = true,  desc = "neovim",            for = "linux" },
	{ run = 'kitty --detach nvim %s',  orphan = true, desc = "neovim (detached)", for = "linux" },
	{ run = 'lazygit -p %s1',          block = true,  desc = "lazygit",           for = "linux" },
	{ run = 'codium %s',               orphan = true, desc = "vscodium",          for = "linux" },
	{ run = 'kitty --directory %s1',   orphan = true, desc = "kitty",             for = "linux" },
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
]
text = [
	{ run = '${EDITOR:-nvim} %s',      block = true,  desc = "$EDITOR",           for = "linux" },
	{ run = 'nvim %s',                 block = true,  desc = "neovim",            for = "linux" },
	{ run = 'kitty --detach nvim %s',  orphan = true, desc = "neovim (detached)", for = "linux" },
	{ run = 'codium %s',               orphan = true, desc = "vscodium",          for = "linux" },
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
]
document = [
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
	{ run = 'zathura %s',              orphan = true, desc = "zathura",           for = "linux" },
	{ run = 'libreoffice %s',          orphan = true, desc = "libreoffice",       for = "linux" },
]
image = [
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
	{ run = 'qimgv %s',                orphan = true, desc = "qimgv",             for = "linux" },
	{ run = 'krita %s',                orphan = true, desc = "krita",             for = "linux" },
	{ run = 'satty --filename %s1',    orphan = true, desc = "satty",             for = "linux" },
]
video = [
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
	{ run = 'mpv %s',                  orphan = true, desc = "mpv",               for = "linux" },
]
audio = [
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
	{ run = 'mpv %s',                  orphan = true, desc = "mpv",               for = "linux" },
]
fallback = [
	{ run = 'xdg-open %s1',            orphan = true, desc = "xdg-open",          for = "linux" },
]

[open]
rules = [
	# Folder
	{ mime = "folder/*", use = [ "folder", "reveal" ] },
	# Text / code
	{ mime = "text/*",                                           use = [ "text", "reveal" ] },
	{ mime = "inode/empty",                                      use = [ "text", "reveal" ] },
	{ mime = "application/{json,ndjson,javascript,x-shellscript}", use = [ "text", "reveal" ] },
	# Media
	{ mime = "image/*",                 use = [ "image", "reveal" ] },
	{ mime = "video/*",                 use = [ "video", "reveal" ] },
	{ mime = "audio/*",                 use = [ "audio", "reveal" ] },
	{ mime = "application/octet-stream", use = [ "video", "reveal" ] },
	# Documents
	{ mime = "application/{pdf,epub+zip,x-mobipocket-ebook}", use = [ "document", "reveal" ] },
	{ mime = "application/vnd.*",                             use = [ "document", "reveal" ] },
	# Archives (built-in `extract` opener needs `7z`)
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Fallback
	{ url = "*", use = [ "fallback", "reveal" ] },
]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
