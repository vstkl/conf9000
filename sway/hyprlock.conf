# Lock screen for sway, used by ~/.config/sway/lock.sh
# Terminal look to match tuigreet and tmux: monospace, square box, base16 ayu-dark colours.
# Read https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/ for all options.

$font = Noto Sans Mono
$bg   = rgba(0b0e14ff)
$bar  = rgba(131721ff)
$dim  = rgba(3e4b59ff)
$fg   = rgba(e6e1cfff)
$blue = rgba(59c2ffff)
$red  = rgba(f07178ff)
$yell = rgba(ffb454ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
}

# Box, like tuigreet's
shape {
    monitor =
    size = 560, 260
    color = $bg
    rounding = 0
    border_size = 1
    border_color = $fg
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Box title sitting on the top border
shape {
    monitor =
    size = 160, 20
    color = $bg
    rounding = 0
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = cmd[] echo " $USER@$(cat /etc/hostname) "
    color = $fg
    font_size = 13
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%a, %d %b %Y - %H:%M:%S"
    color = $fg
    font_size = 13
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>[ screen locked ]</b>
    color = $yell
    font_size = 13
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
    zindex = 2
}

# Password field: one * per typed character
input-field {
    monitor =
    size = 420, 36
    outline_thickness = 1
    rounding = 0
    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.15
    dots_center = false
    outer_color = $dim
    inner_color = $bg
    font_color = $fg
    font_family = $font
    check_color = $blue
    fail_color = $red
    capslock_color = $yell
    fade_on_empty = false
    placeholder_text = <span foreground="##3e4b59">Password:</span>
    fail_text = <span foreground="##f07178">$FAIL ($ATTEMPTS)</span>
    position = 0, -30
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <span foreground="##3e4b59">enter</span> unlock
    color = $fg
    font_size = 11
    font_family = $font
    position = 0, -95
    halign = center
    valign = center
    zindex = 2
}

# tmux-style status bar along the bottom
shape {
    monitor =
    size = 4000, 24
    color = $bar
    rounding = 0
    position = 0, 0
    halign = center
    valign = bottom
    zindex = 0
}
label {
    monitor =
    text = <span background="##59c2ff" foreground="##0b0e14"> [lock] </span> 0:locked*
    color = $fg
    font_size = 11
    font_family = $font
    position = 0, 4
    halign = left
    valign = bottom
    zindex = 1
}
label {
    monitor =
    text = cmd[update:1000] echo "$(cat /etc/hostname) | $(date +'%H:%M %d-%b-%y') "
    color = $fg
    font_size = 11
    font_family = $font
    position = 0, 4
    halign = right
    valign = bottom
    zindex = 1
}
