# tmux config tuned for a neovim user. Cheat sheet: SHORTCUTS.md (prefix ? -> menu, prefix F1 -> sheet)
# Prefix: C-Space (C-Space C-Space sends a literal C-Space).

# ---------------------------------------------------------------- terminal
# TERM inside tmux; kitty (xterm-kitty) outside. RGB = true color, usstyle =
# undercurl + colored underlines (LSP diagnostics in nvim).
set -g default-terminal "tmux-256color"
# (guarded so `prefix r` doesn't append duplicates; RGB replaces the old xterm*:Tc override)
if -F '#{!=:#{@conf9000_term_features},1}' {
  set -as terminal-features ",xterm*:RGB,xterm-kitty:usstyle,alacritty:RGB,foot:RGB"
  set -g @conf9000_term_features 1
}
set -s escape-time 10          # <Esc> in nvim without lag (sensible would set 0)
set -g focus-events on         # nvim FocusGained/autoread + tinty theme reload
set -s set-clipboard on        # OSC 52 -> kitty clipboard (works over ssh too)
set -g allow-passthrough on    # image.nvim (kitty graphics protocol) inside tmux
set -g history-limit 50000
set -g display-time 2000
set -g mouse on

# ---------------------------------------------------------------- prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------------------------------------------------- windows/panes
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# splits keep the current path. | = side by side, - = stacked (mnemonic: the
# divider you see). The defaults " and % are kept (also with the current path).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim style pane selection (prefix h/j/k/l; without prefix use C-h/j/k/l,
# which vim-tmux-navigator shares with nvim splits)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix l used to be "last window" -> moved to prefix Tab
bind Tab last-window
# C-l is taken by the navigator -> clear the shell screen with prefix C-l
bind C-l send-keys C-l

# resize panes with H/J/K/L, repeatable (hold prefix once, then tap)
# (prefix L was "last session"; use prefix ( / ) or the session tree instead)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# swap windows left/right (repeatable)
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ---------------------------------------------------------------- copy mode (vi)
set-window-option -g mode-keys vi
bind v copy-mode                # like prefix [
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# (tmux-yank, loaded below, rebinds y/Y to also pipe into wl-copy)

# ---------------------------------------------------------------- help
# prefix ? = helper menu (tmux's own "list keys" is item k in the menu)
# prefix F1 = SHORTCUTS.md in a popup
bind F1 display-popup -E -w 90% -h 90% -T " tmux shortcuts (q to close) " "~/.config/tmux/scripts/cheatsheet.sh"
bind ? display-menu -T "#[align=centre] tmux  -  prefix C-Space " -x C -y C -- \
  "-#[nodim]Panes  (no prefix: C-h/j/k/l, M-arrows)" "" "" \
  "Split side by side          |"  "|" "split-window -h -c '#{pane_current_path}'" \
  "Split stacked               -"  "-" "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane toggle            z"  z   "resize-pane -Z" \
  "Resize pane     H/J/K/L (repeat)" R "display-message 'prefix H/J/K/L, keep tapping to repeat'" \
  "Swap pane with next         }"  "}" "swap-pane -D" \
  "Pane numbers / jump         q"  q   "display-panes" \
  "Break pane to window        !"  "!" "break-pane" \
  "Kill pane                   x"  x   "confirm-before -p 'kill pane? (y/n)' kill-pane" \
  "" \
  "-#[nodim]Windows  (no prefix: S-Left/Right, M-H/M-L)" "" "" \
  "New window                  c"  c   "new-window" \
  "Rename window               ,"  ","  "command-prompt -I '#W' { rename-window '%%' }" \
  "Last window               Tab"  Tab "last-window" \
  "Choose window               w"  w   "choose-tree -Zw" \
  "" \
  "-#[nodim]Sessions" "" "" \
  "Choose session              s"  s   "choose-tree -Zs" \
  "New session                  "  n   "command-prompt -p 'new session name:' { new-session -s '%%' }" \
  "Rename session              \$" "\$" "command-prompt -I '#S' { rename-session '%%' }" \
  "Detach                      d"  d   "detach-client" \
  "" \
  "-#[nodim]Copy mode (vi)" "" "" \
  "Enter copy mode           v / ["  v  "copy-mode" \
  "Paste buffer                ]"  "]" "paste-buffer" \
  "Choose buffer               =" "=" "choose-buffer -Z" \
  "" \
  "-#[nodim]Config & help" "" "" \
  "Reload tmux.conf            r"  r   "source-file ~/.config/tmux/tmux.conf ; display-message 'tmux.conf reloaded'" \
  "Install plugins             I"  I   "run-shell ~/.config/tmux/plugins/tpm/bindings/install_plugins" \
  "Update plugins              U"  U   "run-shell ~/.config/tmux/plugins/tpm/bindings/update_plugins" \
  "Cheat sheet (popup)        F1"  h   "display-popup -E -w 90% -h 90% -T ' tmux shortcuts (q to close) ' '~/.config/tmux/scripts/cheatsheet.sh'" \
  "List all key bindings"          k   "list-keys -N" \
  "Command prompt              :"  ":" "command-prompt"

# ---------------------------------------------------------------- plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l, C-\ across nvim + tmux
set -g @plugin 'tmux-plugins/tmux-yank'

# keep tpm near the end (plugins may rebind keys defined above)
run '~/.config/tmux/plugins/tpm/tpm'

# base16 colors from tinty (reloaded on `tinty apply`) -- keep last
source-file -q ~/.local/share/tinted-theming/tinty/artifacts/tmux-colors-file.conf
